[workspace]
resolver = "2"
members = ["crates/face2face-core", "app/src-tauri"]
# `cargo test` at the repo root builds only the core, which needs no webview
# libraries. The desktop shell is built through `npm run tauri`.
default-members = ["crates/face2face-core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

# The coremidi crate (under midir, macOS) reads MIDI packets through pointers
# that are unaligned on Intel Macs. That works there, but debug builds check
# pointer alignment and abort the app on the first packet from Mixxx. Seen with
# coremidi 0.9.2; remove when a release fixes `PacketListIterator::next`.
[profile.dev.package.coremidi]
debug-assertions = false
